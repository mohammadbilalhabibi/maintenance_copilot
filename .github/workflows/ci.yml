name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  postgres:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://copilot:copilot@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m postgres

  compose:
    name: Docker Compose end-to-end (mock LLM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bind-mount folders
        run: mkdir -p data models && chmod 777 data models
      - name: Build and start the stack
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build
      - name: Wait for the API (init downloads data and trains a small model first)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            if docker compose -f compose.yaml -f compose.ci.yaml ps -a init | grep -q "Exited (1"; then
              echo "init failed"; exit 1
            fi
            sleep 10
          done
          echo "API did not become healthy"; exit 1
      - name: Show init log
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs init | tail -40
      - name: Smoke test (register, chat, history, Phoenix)
        run: |
          pip install httpx
          python scripts/smoke_test.py --base-url http://localhost:8000 --phoenix http://localhost:6006
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --tail 100
      - name: Image size
        run: docker image ls maintenance-copilot:local

  e2e:
    name: Browser end-to-end (Playwright, mock LLM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m e2e
