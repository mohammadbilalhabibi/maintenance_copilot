name: Release image

# Manual: trains the failure-risk model, bakes it into the image, smoke-tests the image and
# pushes it to GHCR (used by the Azure deployment, see docs/deploy_azure.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/maintenance-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download the Microsoft sample data (checksums verified)
        run: python scripts/download_data.py
      - name: Train the failure-risk model (all 1000 machines)
        run: python scripts/train_model.py --no-mlflow --out release-models/failure_risk.joblib --results /tmp/model_metrics.json
      - name: Build the release image
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build --target release -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
      - name: Smoke test (model and document index are inside the image)
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/smoke.sqlite "$IMAGE:$TAG"
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 3; done
          curl -fsS localhost:8000/api/health | grep -q '"risk_model":true'
          curl -fsS localhost:8000/api/health | grep -q '"document_index":true'
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
